<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steps</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Form */
    .form-row {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
    }

    input[type="date"],
    input[type="number"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="date"]:focus,
    input[type="number"]:focus {
      border-color: #4f46e5;
    }

    input[type="number"] { width: 120px; }

    .btn {
      padding: 0.5rem 1.25rem;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .btn-primary {
      background: #4f46e5;
      color: #fff;
    }
    .btn-primary:hover { background: #4338ca; }

    .btn-cancel {
      background: #e5e7eb;
      color: #555;
      font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
    }
    .btn-cancel:hover { background: #d1d5db; }

    /* Chart */
    .chart-wrap {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.5rem 1rem 1rem;
      margin-bottom: 2rem;
    }

    .chart-empty {
      text-align: center;
      color: #aaa;
      font-size: 0.9rem;
      padding: 2rem 0;
    }

    /* D3 chart styles */
    .axis text {
      font-size: 11px;
      fill: #888;
    }
    .axis path, .axis line {
      stroke: #e0e0e0;
    }
    .axis-label {
      font-size: 11px;
      fill: #aaa;
    }
    .line-path {
      fill: none;
      stroke: #4f46e5;
      stroke-width: 2.5;
    }
    .dot {
      fill: #4f46e5;
      stroke: #fff;
      stroke-width: 2;
      cursor: pointer;
      transition: r 0.1s;
    }
    .dot:hover { r: 7; }

    .tooltip {
      position: absolute;
      background: #222;
      color: #fff;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    /* Records table */
    .records-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #999;
      margin-bottom: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th {
      text-align: left;
      padding: 0.4rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #999;
      border-bottom: 1px solid #e5e7eb;
    }

    td {
      padding: 0.55rem 0.5rem;
      border-bottom: 1px solid #f0f0f0;
    }

    tr:last-child td { border-bottom: none; }

    .btn-sm {
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .btn-edit {
      background: #ede9fe;
      color: #4f46e5;
      border-color: #c4b5fd;
    }
    .btn-edit:hover { background: #ddd6fe; }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
      border-color: #fca5a5;
      margin-left: 0.35rem;
    }
    .btn-delete:hover { background: #fecaca; }

    .no-records {
      text-align: center;
      color: #bbb;
      font-size: 0.85rem;
      padding: 1rem 0;
    }

    #status {
      font-size: 0.8rem;
      color: #888;
      height: 1rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Step Tracker</h1>

    <form id="step-form" class="form-row">
      <div class="field">
        <label for="date-input">Date</label>
        <input type="date" id="date-input" required />
      </div>
      <div class="field">
        <label for="steps-input">Steps</label>
        <input type="number" id="steps-input" min="0" step="1" placeholder="e.g. 8000" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submit-btn">Add</button>
      <button type="button" class="btn btn-cancel" id="cancel-btn" style="display:none">Cancel</button>
    </form>

    <div class="chart-wrap">
      <div id="chart"></div>
      <div class="chart-empty" id="chart-empty">No data yet — add your first entry above.</div>
    </div>

    <div class="records-title">All entries</div>
    <div id="status"></div>
    <table id="records-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Steps</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="records-body">
        <tr><td colspan="3" class="no-records">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const API = '/api/steps';
    let records = [];
    let editingId = null;

    // ── Date helpers ──────────────────────────────────────────────
    function todayISO() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      return `${names[+m - 1]} ${+d}, ${y}`;
    }

    // ── DOM refs ──────────────────────────────────────────────────
    const form       = document.getElementById('step-form');
    const dateInput  = document.getElementById('date-input');
    const stepsInput = document.getElementById('steps-input');
    const submitBtn  = document.getElementById('submit-btn');
    const cancelBtn  = document.getElementById('cancel-btn');
    const tbody      = document.getElementById('records-body');
    const statusEl   = document.getElementById('status');
    const tooltip    = document.getElementById('tooltip');
    const chartEmpty = document.getElementById('chart-empty');

    dateInput.value = todayISO();

    // ── API calls ─────────────────────────────────────────────────
    async function fetchRecords() {
      const r = await fetch(API);
      records = await r.json();
    }

    async function addRecord(date, steps) {
      await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, steps }),
      });
    }

    async function updateRecord(id, date, steps) {
      await fetch(`${API}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date, steps }),
      });
    }

    async function deleteRecord(id) {
      await fetch(`${API}/${id}`, { method: 'DELETE' });
    }

    // ── Form submit ───────────────────────────────────────────────
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const date  = dateInput.value;
      const steps = parseInt(stepsInput.value, 10);
      if (!date || isNaN(steps)) return;

      submitBtn.disabled = true;
      setStatus('Saving…');

      try {
        if (editingId) {
          await updateRecord(editingId, date, steps);
        } else {
          await addRecord(date, steps);
        }
        cancelEdit();
        await fetchRecords();
        renderTable();
        renderChart();
        setStatus('');
      } catch (err) {
        setStatus('Error saving. Try again.');
      } finally {
        submitBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener('click', cancelEdit);

    function cancelEdit() {
      editingId = null;
      submitBtn.textContent = 'Add';
      cancelBtn.style.display = 'none';
      dateInput.value = todayISO();
      stepsInput.value = '';
    }

    function startEdit(rec) {
      editingId = rec._id;
      dateInput.value  = rec.date;
      stepsInput.value = rec.steps;
      submitBtn.textContent = 'Save';
      cancelBtn.style.display = '';
      dateInput.focus();
    }

    function setStatus(msg) { statusEl.textContent = msg; }

    // ── Table ─────────────────────────────────────────────────────
    function renderTable() {
      if (!records.length) {
        tbody.innerHTML = '<tr><td colspan="3" class="no-records">No entries yet.</td></tr>';
        return;
      }
      tbody.innerHTML = records
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .map(r => `
          <tr data-id="${r._id}">
            <td>${formatDate(r.date)}</td>
            <td>${r.steps.toLocaleString()}</td>
            <td style="text-align:right">
              <button class="btn-sm btn-edit" data-action="edit">Edit</button>
              <button class="btn-sm btn-delete" data-action="delete">Delete</button>
            </td>
          </tr>`)
        .join('');
    }

    tbody.addEventListener('click', async e => {
      const action = e.target.dataset.action;
      if (!action) return;
      const id = e.target.closest('tr').dataset.id;
      if (action === 'edit') {
        const rec = records.find(r => r._id === id);
        if (rec) startEdit(rec);
      } else if (action === 'delete') {
        if (!confirm('Delete this entry?')) return;
        setStatus('Deleting…');
        try {
          await deleteRecord(id);
          await fetchRecords();
          renderTable();
          renderChart();
          setStatus('');
        } catch {
          setStatus('Error deleting.');
        }
      }
    });

    // ── D3 Chart ──────────────────────────────────────────────────
    const margin = { top: 20, right: 20, bottom: 40, left: 55 };

    function getChartWidth() {
      const wrap = document.querySelector('.chart-wrap');
      return wrap.clientWidth - margin.left - margin.right - 8;
    }

    let svg, xScale, yScale, xAxis, yAxis, linePath, dotsGroup;
    const CHART_HEIGHT = 240;

    function initChart() {
      d3.select('#chart').selectAll('*').remove();

      const width  = getChartWidth();
      const height = CHART_HEIGHT;

      svg = d3.select('#chart')
        .append('svg')
        .attr('width',  width  + margin.left + margin.right)
        .attr('height', height + margin.top  + margin.bottom)
        .append('g')
        .attr('transform', `translate(${margin.left},${margin.top})`);

      // Grid lines
      svg.append('g').attr('class', 'grid-x');
      svg.append('g').attr('class', 'grid-y');

      // Axes
      svg.append('g').attr('class', 'axis axis-x')
        .attr('transform', `translate(0,${height})`);
      svg.append('g').attr('class', 'axis axis-y');

      // Line
      svg.append('path').attr('class', 'line-path');

      // Dots group
      dotsGroup = svg.append('g').attr('class', 'dots');

      xScale = d3.scaleTime().range([0, width]);
      yScale = d3.scaleLinear().range([height, 0]).nice();
    }

    function renderChart() {
      const sorted = records
        .map(r => ({ ...r, dateObj: new Date(r.date + 'T12:00:00') }))
        .sort((a, b) => a.dateObj - b.dateObj);

      chartEmpty.style.display = sorted.length ? 'none' : '';

      if (!svg) initChart();

      const width  = getChartWidth();
      const height = CHART_HEIGHT;

      if (!sorted.length) return;

      // Update scales
      const xExt = d3.extent(sorted, d => d.dateObj);
      // Add a little padding on x
      const pad = (xExt[1] - xExt[0]) * 0.05 || 86400000;
      xScale.domain([new Date(xExt[0] - pad), new Date(xExt[1].getTime() + pad)])
            .range([0, width]);

      yScale.domain([0, d3.max(sorted, d => d.steps) * 1.1])
            .range([height, 0])
            .nice();

      // Axis generators
      xAxis = d3.axisBottom(xScale)
        .ticks(Math.min(sorted.length, 6))
        .tickFormat(d3.timeFormat('%b %d'));

      yAxis = d3.axisLeft(yScale)
        .ticks(5)
        .tickFormat(d => d >= 1000 ? `${d / 1000}k` : d);

      svg.select('.axis-x').transition().duration(300).call(xAxis);
      svg.select('.axis-y').transition().duration(300).call(yAxis);

      // Horizontal grid lines
      svg.select('.grid-y')
        .call(d3.axisLeft(yScale)
          .ticks(5)
          .tickSize(-width)
          .tickFormat(''))
        .call(g => {
          g.select('.domain').remove();
          g.selectAll('line').attr('stroke', '#f0f0f0');
        });

      // Line
      const lineGen = d3.line()
        .x(d => xScale(d.dateObj))
        .y(d => yScale(d.steps))
        .curve(d3.curveMonotoneX);

      svg.select('.line-path')
        .datum(sorted)
        .transition().duration(300)
        .attr('d', lineGen);

      // Dots
      const dots = dotsGroup.selectAll('.dot').data(sorted, d => d._id);

      dots.enter()
        .append('circle')
        .attr('class', 'dot')
        .attr('r', 5)
        .attr('cx', d => xScale(d.dateObj))
        .attr('cy', d => yScale(d.steps))
        .on('mousemove', onDotHover)
        .on('mouseleave', onDotLeave)
        .merge(dots)
        .transition().duration(300)
        .attr('cx', d => xScale(d.dateObj))
        .attr('cy', d => yScale(d.steps));

      dots.exit().remove();

      // Re-bind events after merge (re-select all)
      dotsGroup.selectAll('.dot')
        .on('mousemove', onDotHover)
        .on('mouseleave', onDotLeave);
    }

    function onDotHover(event, d) {
      tooltip.style.opacity = '1';
      tooltip.innerHTML = `<strong>${formatDate(d.date)}</strong><br>${d.steps.toLocaleString()} steps`;
      tooltip.style.left = (event.pageX + 14) + 'px';
      tooltip.style.top  = (event.pageY - 36) + 'px';
    }

    function onDotLeave() {
      tooltip.style.opacity = '0';
    }

    // Resize
    window.addEventListener('resize', () => {
      initChart();
      renderChart();
    });

    // ── Init ──────────────────────────────────────────────────────
    (async () => {
      try {
        await fetchRecords();
      } catch {
        setStatus('Could not load data.');
      }
      renderTable();
      initChart();
      renderChart();
    })();
  </script>
</body>
</html>
